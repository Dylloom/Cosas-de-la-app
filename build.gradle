plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.ejemplo.nfcapp"
    compileSdk 36

    defaultConfig {
        applicationId "com.ejemplo.nfcapp"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

kotlin {
    compilerOptions {
        // CORREGIDO: Ahora coincide con la versión 11 de Java
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}

dependencies {
    // Versiones modernas de ciclo de vida (reemplazan a android.arch)
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'

    // Librerías de AndroidX modernas
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.6.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.6.0'

    // Diseño e interfaz moderno (reemplaza a com.android.support:design)
    implementation 'com.google.android.material:material:1.10.0'

    // NUEVA: Librería oficial para Huella Dactilar y Rostro
    implementation 'androidx.biometric:biometric:1.1.0'
}
